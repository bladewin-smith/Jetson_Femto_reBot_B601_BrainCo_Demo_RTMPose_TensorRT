hand_palm_b601_control_node:
  ros__parameters:
    b601_control_mode: semantic_joint
    # Camera-space anatomical-wrist smoothing before semantic mapping.
    palm_filter_alpha: 0.30
    # Adaptive bandwidth keeps a stationary palm quiet while reducing latency
    # during deliberate motion.  Per-frame innovation clipping rejects pose
    # estimator jumps before they can reverse a joint command.
    palm_filter_fast_alpha: 0.72
    palm_filter_speed_scale_m_s: 0.30
    palm_filter_max_innovation_m: [0.030, 0.030, 0.030]
    b601_semantic_joint_gains: [3.00, -0.60, 0.18, 0.15, 0.75]
    b601_semantic_angle_deadband_deg: [5.0, 5.0, 3.0]
    # Wrist intent is accepted only while the palm is translationally stable.
    # Raw depth-angle flips are rejected, not clipped and accumulated.
    b601_wrist_twist_filter_alpha: 0.18
    b601_wrist_twist_max_innovation_deg: 8.0
    b601_wrist_twist_max_raw_rate_deg_s: 180.0
    b601_wrist_twist_max_raw_jump_deg: 25.0
    b601_wrist_twist_translation_gate_m_s: 0.050
    b601_wrist_twist_stationary_confirm_samples: 3
    # Rebase the vertical wrist anchor while the wrist angle is moving, so a
    # pure J6 gesture cannot manufacture a J2/J3/J4 down command.
    b601_vertical_wrist_decoupling_enabled: true
    # A faster J6-filtered angular speed can latch the hold only after a
    # meaningful roll delta (or confirmed J6 direction) arms it. This rejects
    # the persistent 1--2 degree landmark noise seen in the hardware logs.
    # Release additionally requires anatomical-wrist height to stop settling.
    b601_vertical_wrist_hold_rate_deg_s: 3.0
    b601_vertical_wrist_hold_min_delta_deg: 6.0
    b601_vertical_wrist_release_rate_deg_s: 1.0
    b601_vertical_wrist_release_samples: 5
    b601_vertical_wrist_release_lift_rate_m_s: 0.012
    b601_wrist_twist_activate_deg: 12.0
    b601_wrist_twist_release_deg: 6.0
    b601_wrist_twist_confirm_samples: 3
    b601_wrist_twist_reverse_confirm_samples: 6
    b601_wrist_twist_min_joint_offset_rad: 0.080
    b601_wrist_twist_soft_start_s: 0.30
    # Published B601-DM range intersected with the current official DM URDF.
    # A second 0.10 rad tracking margin is retained inside these boundaries;
    # J2/J3 may return to the verified table pose but never cross it.
    b601_safe_joint_lower_rad: [-2.6005, -3.5954, -3.5954, -1.4992, -1.4992, -1.4992]
    b601_safe_joint_upper_rad: [2.6005, 0.0, 0.0, 1.4992, 1.4992, 1.4992]
    b601_joint_limit_margin_rad: 0.10
    # These broad semantic offsets no longer define the hard safety boundary;
    # the official/URDF intersection above and table-clearance projection do.
    b601_semantic_max_joint_offset_rad: [1.60, 1.40, 1.50, 1.00, 0.008, 1.20]
    b601_semantic_max_step_rad: [0.0025, 0.0025, 0.0030, 0.0020, 0.0010, 0.0060]
    b601_joint_kp: [120.0, 120.0, 180.0, 30.0, 35.0, 30.0]
    b601_joint_kd: [8.0, 8.0, 8.0, 4.0, 2.0, 2.0]
    b601_joint_effort_limit_nm: [8.0, 10.0, 16.0, 6.0, 4.0, 4.0]
    # Interpolate the 20 Hz semantic goals on every 500 Hz MIT cycle. These
    # limits shape only the streamed setpoint; the outer semantic bounds below
    # remain responsible for operator-following speed and workspace size.
    b601_stream_max_velocity_rad_s: [0.25, 0.30, 0.35, 0.15, 0.10, 0.25]
    b601_stream_max_acceleration_rad_s2: [2.0, 2.5, 3.0, 1.2, 0.8, 2.0]
    b601_stream_max_jerk_rad_s3: [80.0, 100.0, 120.0, 50.0, 30.0, 80.0]
    # Automatically couple the 500 Hz stream speed to the 25 Hz semantic
    # target rate, then feed the estimated target velocity into the stream.
    # This avoids arriving early and stopping at every camera update.
    b601_stream_outer_velocity_scale: 1.35
    b601_stream_planar_outer_velocity_scale: 1.15
    b601_stream_goal_velocity_filter_alpha: 0.45
    b601_stream_goal_velocity_stale_cycles: 2.0
    b601_stream_goal_period_filter_alpha: 0.20
    b601_stream_goal_velocity_max_hold_s: 0.55
    b601_stream_goal_observed_period_max_s: 0.50
    b601_semantic_outer_dt_max_s: 0.35
    # Resolved-rate velocity is primary. Planar position correction rises
    # smoothly from 18% to 32% only as target lead approaches its tracking
    # window, preventing both early arrival and gravity-loaded ratcheting.
    b601_stream_position_correction_gain_s: 5.0
    b601_stream_position_correction_max_fraction: 0.35
    b601_stream_planar_position_correction_min_fraction: 0.18
    b601_stream_planar_position_correction_max_fraction: 0.32
    b601_semantic_max_tracking_error_rad: [0.032, 0.055, 0.110, 0.060, 0.008, 0.090]
    b601_semantic_stall_error_rad: [0.010, 0.015, 0.030, 0.015, 0.010, 0.012]
    b601_semantic_stall_min_progress_rad: 0.0015
    b601_semantic_stall_timeout_s: 4.0
    b601_semantic_vertical_primary_joint: 3
    b601_semantic_vertical_follower_progress_lead: 0.15
    b601_semantic_vertical_max_lift_m: 0.180
    b601_semantic_min_lift_before_articulation_m: 0.018
    b601_semantic_min_chain_clearance_m: 0.001
    b601_semantic_vertical_height_profile: [0.50, 0.82, 1.0]
    # Palm depth/height form one 2-D Cartesian task solved over J2/J3/J4.
    # Input scale is [forward, height]; mobility is [J2, J3, J4].
    b601_semantic_planar_input_scale: [0.45, 1.0]
    b601_semantic_planar_max_forward_m: 0.150
    b601_semantic_planar_joint_mobility: [0.85, 1.00, 0.50]
    b601_semantic_planar_task_weights: [1.00, 0.65, 0.85, 1.00]
    b601_semantic_planar_command_max_velocity_m_s: [0.060, 0.035]
    # Reject brief direction flips, then brake/reverse with bounded acceleration.
    b601_semantic_motion_reverse_deadband_m: [0.006, 0.0035, 0.005]
    b601_semantic_motion_reverse_confirm_samples: 3
    b601_semantic_planar_command_max_acceleration_m_s2: [0.32, 0.16]
    b601_semantic_planar_command_deadband_m: [0.0015, 0.0015]
    # Stop accumulating operator displacement when the physical arm has not
    # yet caught up, while always permitting a command back toward feedback.
    b601_semantic_planar_tracking_error_m: [0.030, 0.050]
    b601_semantic_planar_backpressure_start_fraction: 0.65
    b601_semantic_planar_backpressure_rates_s: [1.0, 1.5]
    # The rate-limited table gate restricts only new outward motion, so a
    # falling gate cannot manufacture an operator-opposing command. Continuous
    # follower mobility replaces the old staged J3 progress switch.
    b601_semantic_clearance_gate_rates_s: [1.5, 3.0]
    b601_semantic_clearance_gate_deadband: 0.03
    b601_semantic_planar_follower_min_mobility_scale: 0.30
    # Resolved-rate J2/J3/J4 task feedback and coordinated acceleration limits.
    b601_semantic_planar_task_error_gain_s: [2.0, 2.0]
    b601_semantic_planar_task_correction_max_velocity_m_s: [0.025, 0.020]
    # Downward link/TCP corrections require a negative operator command.
    # Static pose-error adaptation may still lift, but cannot lower the arm.
    b601_semantic_vertical_descent_guard_enabled: true
    b601_semantic_vertical_descent_intent_deadband_m_s: 0.0015
    # The TCP is always protected. Intermediate links join the velocity guard
    # only inside this band; the full-path table projection remains the floor.
    b601_semantic_vertical_descent_guard_clearance_margin_m: 0.010
    b601_semantic_planar_joint_max_acceleration_rad_s2: [0.45, 0.60, 0.20]
    b601_semantic_j1_target_max_velocity_rad_s: 0.08
    b601_semantic_j1_target_max_acceleration_rad_s2: 0.35
    b601_semantic_j1_target_deadband_rad: 0.0015
    b601_semantic_j4_target_max_velocity_rad_s: 0.025
    b601_semantic_j4_target_max_acceleration_rad_s2: 0.10
    b601_semantic_j4_target_deadband_rad: 0.0015
    b601_semantic_j6_target_max_velocity_rad_s: 0.10
    b601_semantic_j6_target_max_acceleration_rad_s2: 0.40
    b601_semantic_j6_target_deadband_rad: 0.0015
    b601_semantic_vertical_solver_step_rad: 0.015
    b601_semantic_vertical_solver_iterations: 12
    b601_semantic_vertical_orientation_weight_m_per_rad: 0.02
    b601_semantic_table_clearance_tolerance_m: 0.001

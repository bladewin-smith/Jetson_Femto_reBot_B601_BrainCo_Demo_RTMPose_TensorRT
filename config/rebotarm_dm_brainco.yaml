# B601-DM arm-only MotorBridge configuration for an independently connected
# BrainCo Revo2 hand. The seventh Seeed gripper motor is deliberately omitted.

name: "reBot Arm B601-DM + BrainCo"
channel: /dev/ttyACM0
rate: 500
arm_control_mode: "mit"

groups:
  arm:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]

joints:
  - name: joint1
    motor_id: 0x01
    feedback_id: 0x11
    model: "4340P"
    vendor: "damiao"
    MIT: {kp: 120.0, kd: 8.0}
  - name: joint2
    motor_id: 0x02
    feedback_id: 0x12
    model: "4340P"
    vendor: "damiao"
    MIT: {kp: 120.0, kd: 8.0}
  - name: joint3
    motor_id: 0x03
    feedback_id: 0x13
    model: "4340P"
    vendor: "damiao"
    MIT: {kp: 120.0, kd: 8.0}
  - name: joint4
    motor_id: 0x04
    feedback_id: 0x14
    model: "4310"
    vendor: "damiao"
    MIT: {kp: 45.0, kd: 2.0}
  - name: joint5
    motor_id: 0x05
    feedback_id: 0x15
    model: "4310"
    vendor: "damiao"
    MIT: {kp: 35.0, kd: 2.0}
  - name: joint6
    motor_id: 0x06
    feedback_id: 0x16
    model: "4310"
    vendor: "damiao"
    MIT: {kp: 30.0, kd: 2.0}
